openapi: "3.0.3"

info:
  title: Promptdown API
  version: "1.0.0"
  description: API do Promptdown — feed público e interações de posts.
  contact:
    name: Promptdown
    email: amarildonovohamburgo@gmail.com

tags:
  - name: posts
    description: Operações sobre posts do feed público.

paths:
  /posts:
    get:
      summary: Lista posts paginados
      description: Retorna uma lista paginada de posts ordenada por data de criação decrescente.
      operationId: getPosts
      tags:
        - posts
      parameters:
        - name: _page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Número da página (base 1).
        - name: _limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Quantidade de posts por página.
      responses:
        "200":
          description: Lista de posts ordenada por data de criação decrescente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "500":
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerError"

  /posts/{id}:
    patch:
      summary: Atualiza campos de um post
      description: "Atualiza campos parciais de um post (ex.: incrementar likes). Requer autenticação."
      operationId: updatePost
      tags:
        - posts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador único do post.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostPatch"
      responses:
        "200":
          description: Post atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          description: Não autenticado — token ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "422":
          description: Dados inválidos no corpo da requisição.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Post:
      type: object
      required:
        - id
        - title
        - body
        - author
        - likes
        - createdAt
      properties:
        id:
          type: string
          description: Identificador único do post.
        title:
          type: string
          description: Título do post (truncagem a 120 chars é responsabilidade do cliente).
        body:
          type: string
          description: Conteúdo completo do post em Markdown.
        author:
          type: string
          description: Nome de exibição do autor.
        likes:
          type: integer
          minimum: 0
          description: Contador de likes.
        createdAt:
          type: string
          format: date-time
          description: Data de criação no formato ISO 8601.

    PostPatch:
      type: object
      required:
        - likes
      properties:
        likes:
          type: integer
          minimum: 0
          description: Novo valor do contador de likes.

    ServerError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Mensagem de erro legível.

    UnauthorizedError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Unauthorized

    ValidationError:
      type: object
      required:
        - errors
      properties:
        errors:
          type: object
          properties:
            likes:
              type: string
              description: Mensagem de validação para o campo likes.
